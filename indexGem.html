<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVS - Çevrimdışı Hayatta Kalma Asistanı</title>
    
    <!-- Çevrimdışı Leaflet Harita CSS (Yerel yollarını kendi projene göre ayarla) -->
    <link rel="stylesheet" href="./maps/leaflet.css" />
    <script src="./maps/leaflet.js"></script>
    <script src="./assets/js/sql-wasm.js"></script>
    <script src="./assets/js/marked.min.js"></script>
    <script src="./assets/js/pmtiles.js"></script>
    <script src="./assets/js/protomaps-leaflet.js"></script>
    <style>
        /* PİL DOSTU OLED KOYU TEMA */
        body { margin: 0; padding: 0; background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ÜST ARAMA VE MOD ÇUBUĞU */
        header { background-color: #1a1a1a; padding: 15px; border-bottom: 2px solid #333; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; z-index: 10; }
        .search-container { display: flex; gap: 10px; flex-grow: 1; max-width: 600px; }
        input[type="text"] { flex-grow: 1; padding: 10px; background-color: #2c2c2c; border: 1px solid #444; color: white; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background-color: #2e7d32; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #1b5e20; }
        button.map-btn { background-color: #1565c0; }
        
        .modes { display: flex; gap: 15px; background: #222; padding: 8px 15px; border-radius: 5px; font-size: 0.9em; }
        .modes label { cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* ÇİFT PANELLİ ALT KISIM */
        .main-container { display: flex; flex-grow: 1; overflow: hidden; }
        
        /* SOL MENÜ (KATEGORİ AĞACI) */
        .sidebar { width: 300px; background-color: #181818; border-right: 1px solid #333; overflow-y: auto; padding: 15px; box-sizing: border-box; }
        .sidebar h3 { color: #4CAF50; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .category { margin-bottom: 10px; }
        .cat-title { font-weight: bold; color: #ffb300; cursor: pointer; padding: 5px 0; display: flex; justify-content: space-between; user-select: none; }
        .cat-title:hover { color: #ffe54c; }
        .sub-list { list-style: none; padding-left: 15px; margin: 5px 0; display: none; }
        .sub-list li { padding: 6px 0; color: #bbb; cursor: pointer; font-size: 0.95em; border-left: 2px solid transparent; padding-left: 5px; }
        .sub-list li:hover { color: #fff; border-left: 2px solid #4CAF50; }
        .sidebar {
    width: 320px; /* Menünün ideal genişliğini belirleyin */
    min-width: 320px;
    flex-shrink: 0; /* KRİTİK KOD: İçeriğin menüyü daraltmasını engeller */
    overflow-y: auto; /* Kendi içinde kaydırma çubuğu çıkması için */
    word-break: break-word; /* Uzun kelimelerin taşmasını engeller */
}

        /* SAĞ İÇERİK ALANI */
        .content { flex-grow: 1; padding: 25px; overflow-y: auto; background-color: #121212; position: relative; }
        .markdown-body { line-height: 1.6; font-size: 1.1em; }
        .markdown-body img { max-width: 100%; border-radius: 8px; margin: 15px 0; border: 1px solid #333; }
        .content-area {
    flex: 1; /* Kalan tüm alanı kapla */
    min-width: 0; /* KRİTİK KOD: Uzun metinlerin flex yapısını bozup sidebar'ı ezmesini durdurur */
    overflow-y: auto;
    padding: 20px;
}
        /* ACİL DURUM VURGUSU */
        .severity-3 { border-left: 5px solid #d32f2f; padding-left: 15px; background-color: rgba(211, 47, 47, 0.05); }
        .severity-3 h2 { color: #ef5350; }
        
        #map-area { height: 400px; width: 100%; border-radius: 8px; margin-bottom: 20px; display: none; border: 2px solid #444; }
    </style>
</head>
<body>

    <header>
        <div style="font-size: 1.5em; font-weight: 900; color: #4CAF50; letter-spacing: 1px;">AVS</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Ne arıyorsunuz? (Örn: kanama, yelkenli, amoksisilin)">
            <button id="searchBtn">Ara</button>
            <button id="toggleMapBtn" class="map-btn">🗺️ Harita</button>
        </div>
        <div class="modes">
            <label><input type="radio" name="searchMode" value="statik" checked> 📄 Bilgi</label>
            <label><input type="radio" name="searchMode" value="acil"> 🚨 Acil</label>
            <label><input type="radio" name="searchMode" value="ai"> 🤖 AI Triyaj</label>
        </div>
    </header>

    <div class="main-container">
        <!-- SOL PANEL: DİNAMİK AĞAÇ -->
        <div class="sidebar">
            <h3>Ansiklopedi İndeksi</h3>
            <div id="tree-container">Yükleniyor...</div>
        </div>

        <!-- SAĞ PANEL: OKUMA VE HARİTA EKRANI -->
        <div class="content">
            <div id="map-area"></div>
            <div id="content-area">
                <h2 style="color: #666; text-align: center; margin-top: 20%;">AVS Çevrimdışı Hayatta Kalma Ansiklopedisine Hoş Geldiniz.<br><br><small style="font-size: 0.6em;">Sol menüden bir kategori seçin veya arama yapın.</small></h2>
            </div>
        </div>
    </div>

    <script src="./assets/js/app.js"></script>

    <!-- YAPAY ZEKA WORKER BAĞLANTISI -->
    <script type="module">
        const aiWorker = new Worker('./assets/js/ai-worker.js', { type: 'module' });
        let isAiReady = false;

        aiWorker.onmessage = (event) => {
            const { status, data, result, message } = event.data;
            if (status === 'progress') {
                document.getElementById('content-area').innerHTML = `<h3 style="color:#ffb300">AI Başlatılıyor: %${Math.round(data.progress || 0)}</h3><p>Arka planda işleniyor...</p>`;
            } else if (status === 'ready') {
                isAiReady = true;
                document.getElementById('content-area').innerHTML = "<h3 style='color:#4CAF50'>Yapay Zeka Arka Planda Hazır!</h3><p>AI Modunda arama yapabilirsiniz.</p>";
            } else if (status === 'error') {
                document.getElementById('content-area').innerHTML = `<h3 style="color:red">AI Hatası: ${message}</h3>`;
            }
        };

        window.askLocalAI = function (query, context) {
            return new Promise((resolve, reject) => {
                if (!isAiReady) {
                    document.getElementById('content-area').innerHTML = "<h3>AI Motoru tetikleniyor...</h3>";
                    aiWorker.postMessage({ action: 'init' });
                    const checkReady = setInterval(() => {
                        if (isAiReady) {
                            clearInterval(checkReady);
                            document.getElementById('content-area').innerHTML = "<h3>🤖 AI Triyaj Analizi Yapıyor... (Lütfen bekleyin)</h3>";
                            aiWorker.postMessage({ action: 'generate', query, context });
                        }
                    }, 500);
                } else {
                    document.getElementById('content-area').innerHTML = "<h3>🤖 AI Triyaj Analizi Yapıyor...</h3>";
                    aiWorker.postMessage({ action: 'generate', query, context });
                }

                const responseListener = (event) => {
                    if (event.data.status === 'complete') {
                        aiWorker.removeEventListener('message', responseListener);
                        resolve(event.data.result);
                    } else if (event.data.status === 'error') {
                        aiWorker.removeEventListener('message', responseListener);
                        reject(event.data.message);
                    }
                };
                aiWorker.addEventListener('message', responseListener);
            });
        };
    </script>
</body>
</html>
